alias: Zamp UPS Low Voltage
description: >-
  The NOCO charger auto-shuts off after 96 hrs, so it is not left on: "Zamp
  Charger On Below 50%" turns switch.zamp_battery_charger on when gauge SOC
  drops below 51. If gauge SOC keeps falling to 40% anyway, charging has failed
  — charger switch didn't turn on, NOCO not charging, tripped breaker, BMS
  charge MOSFET off, or the load is outrunning the charger.
  Gated on the BMS BLE switch: the firmware filters NaN, so when BLE is off the
  SOC/voltage sensors hold a STALE value rather than going unavailable — only
  alarm when the link is live and the reading is real.
triggers:
  - trigger: numeric_state
    entity_id:
      - sensor.zamp_ups_monitor_gauge_soc
    below: 40
    for:
      minutes: 10
conditions:
  - condition: state
    entity_id: switch.zamp_ups_monitor_bms_ble
    state: "on"
actions:
  - action: notify.mobile_app_sm_f776u1
    metadata: {}
    data:
      title: ⚠️ Zamp UPS Low Battery
      message: >-
        Battery {{ states('sensor.zamp_ups_monitor_gauge_soc') | round(0) }}%
        ({{ states('sensor.zamp_ups_monitor_pack_voltage') }}V), charger
        {{ states('switch.zamp_battery_charger') }} — charging failed below 50%.
        {{ now().strftime('%d %b %Y – %-I:%M %p') }}
      data:
        ttl: 0
        priority: high
    alias: Notifications 'Send a notification to caseman'
  - action: system_log.write
    metadata: {}
    data:
      level: warning
      message: >-
        Zamp UPS low battery: {{ states('sensor.zamp_ups_monitor_gauge_soc') | round(0) }}%
        ({{ states('sensor.zamp_ups_monitor_pack_voltage') }}V), charger
        {{ states('switch.zamp_battery_charger') }} — charging failed below 50%
      logger: zamp_ups
mode: single
