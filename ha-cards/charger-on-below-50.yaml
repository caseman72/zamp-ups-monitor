alias: Zamp Charger On Below 50%
description: Restore charger power when battery SoC drops below 50%.
triggers:
  - trigger: numeric_state
    entity_id: sensor.zamp_ups_monitor_gauge_soc
    below: 51
conditions:
  - condition: state
    entity_id: switch.zamp_battery_charger
    state: 'off'
actions:
  - action: switch.turn_on
    target:
      entity_id: switch.zamp_battery_charger
  - action: notify.mobile_app_sm_f776u1
    metadata: {}
    data:
      title: 🔌 Zamp Charger On
      message: >-
        Battery {{ states('sensor.zamp_ups_monitor_gauge_soc') | round(0) }}%
        ({{ states('sensor.zamp_ups_monitor_pack_voltage') }}V) — charger
        turned on. {{ now().strftime('%d %b %Y – %-I:%M %p') }}
      data:
        ttl: 0
        priority: high
    alias: Notifications 'Send a notification to caseman'
mode: single
